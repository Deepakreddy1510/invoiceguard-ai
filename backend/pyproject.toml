[project]
name = "invoiceguard-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "pydantic-settings>=2.8,<3",
    "pymupdf>=1.25,<2",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.10,<3",
    "cryptography>=46,<51",
    "tzdata>=2025.2; sys_platform == 'win32'",
    "boto3>=1.38,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "pillow>=11,<13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
