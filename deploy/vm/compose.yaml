# Separate project: never merge with the Windows development compose.yaml.
name: invoiceguard-vm
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-app: &app
  image: ${APP_IMAGE:?Set an immutable local image tag}
  init: true
  env_file:
    - path: ${VM_ENV_FILE:?Set the absolute private environment file path}
      format: raw
  environment:
    APP_ENVIRONMENT: production
    AUTH_MODE: supabase
    STORAGE_BACKEND: s3
    STORAGE_DIR: /tmp/invoiceguard-staging
    DATABASE_URL: postgresql+psycopg://invoiceguard:${POSTGRES_PASSWORD:?Set a hex database password}@db:5432/invoiceguard
    FRONTEND_ORIGIN: https://${APP_DOMAIN:?Set the public DNS hostname}
    PORT: "8000"
    OMP_THREAD_LIMIT: "1"
    ALLOW_MANUAL_EXTRACTION_MODES: "false"
  restart: unless-stopped
  stop_grace_period: 200s
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  networks: [private, outbound]
  logging: *logging
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: invoiceguard
      POSTGRES_DB: invoiceguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a hex database password}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [private]
    restart: unless-stopped
    mem_limit: 768m
    shm_size: 128m
    stop_grace_period: 60s
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U invoiceguard -d invoiceguard"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
  migrate:
    <<: *app
    profiles: [maintenance]
    restart: "no"
    command: [python, -m, scripts.run_vm, migrate]
    healthcheck:
      disable: true
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *app
    command: [python, -m, scripts.run_vm, api]
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
  worker:
    <<: *app
    command: [python, -m, scripts.run_vm, worker]
    mem_limit: 2g
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, scripts.run_vm, worker-health]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
  proxy:
    image: caddy:2.10.2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set the public DNS hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact email}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [outbound]
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
networks:
  private:
    internal: true
  outbound: {}
volumes:
  postgres_data: {}
  caddy_data: {}
  caddy_config: {}
