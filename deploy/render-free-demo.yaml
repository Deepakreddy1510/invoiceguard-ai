# TEMPORARY FREE DEMO ONLY. Applying this Blueprint creates exactly these two Free resources.
# Reuse the existing invoiceguard-runtime group and existing private S3 storage.
# No deployment is triggered by committing this file. See deploy/render-free-demo.md.
databases:
- name: invoiceguard-free-demo-db
  plan: free
  databaseName: invoiceguard_demo
  user: invoiceguard_demo
  ipAllowList: []
  region: oregon
services:
- type: web
  name: invoiceguard-free-demo
  runtime: docker
  plan: free
  repo: https://github.com/Deepakreddy1510/invoiceguard-ai
  branch: main
  dockerfilePath: ./Dockerfile
  dockerContext: .
  dockerCommand: python -m scripts.run_free_demo
  healthCheckPath: /api/v1/health/ready
  region: oregon
  autoDeploy: false
  envVars:
  - fromGroup: invoiceguard-runtime
  - key: DATABASE_URL
    fromDatabase:
      name: invoiceguard-free-demo-db
      property: connectionString
  - key: APP_ENVIRONMENT
    value: production
  - key: AUTH_MODE
    value: supabase
  - key: STORAGE_BACKEND
    value: s3
  - key: STORAGE_DIR
    value: /tmp/invoiceguard-staging
  - key: OMP_THREAD_LIMIT
    value: "1"
